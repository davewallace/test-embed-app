<html>
    <head>
        <title>Generic Web App</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            /**
             * All CSS Variables from the parent DOM (Totara) are available in a Shadow DOM's stylesheets, so we can use them to style the embedded app.
             * This allows the embedded app to automatically match the Totara theme without needing to duplicate any theme logic.
             */
            body {
                color: var(--color-primary);
                background: var(--color-background);
            }
        </style>
    </head>

    <body>
        <p>Hello Totara.</p>
        <button onclick="expandBodyHeight()">Expand app height</button>
        <script type="text/javascript">
            /**
             * This is a generic web app that can be embedded in Totara using the AppEmbed component.
             * This app could be anything, with any height, including being fully dynamic, so we need
             * to send a message to the parent DOM (Totara) to tell it to resize the iframe to fit the content of the app.
             */
            function expandAppHeight() {
                console.log('expanding app height');
                window.parent.postMessage({ type: 'appEmbed:resize', height: getDocumentHeight() }, '*');
            }
            function expandBodyHeight() {
                console.log('expanding body height');
                document.getElementsByTagName('body')[0].style.height = [100, 200, 300, 500][Math.floor(Math.random() * 4)] + 'px';
                expandAppHeight();
            }
            function getDocumentHeight() {
                const body = document.body;
                const html = document.documentElement;
                return Math.max(body.scrollHeight, body.offsetHeight, html.clientHeight, html.scrollHeight, html.offsetHeight);
            }
            document.addEventListener('DOMContentLoaded', (event) => {
                console.log('DOMContentLoaded');
                expandAppHeight();
            });
        </script>
    </body>
</html>
