<html>
    <head>
        <title>Generic Web App</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            /**
             * All CSS Variables from the parent DOM (Totara) are available in a Shadow DOM's stylesheets, so we can use them to style the embedded app.
             * This allows the embedded app to automatically match the Totara theme without needing to duplicate any theme logic.
             */
            body {
                color: var(--color-primary);
            }
                #app {
                    padding: var(--gap-2);
                    background: var(--color-background);
                }
        </style>
    </head>

    <body>
        <div id="app">
            <p>Hello Totara.</p>
            <button onclick="expandContentHeight()">Expand content height</button>
        </div>
        <script type="text/javascript">
            /**
             * This is a generic web app that can be embedded in Totara using the AppEmbed component.
             * This app could be anything, with any height, including being fully dynamic, so we need
             * to send a message to the parent DOM (Totara) to tell it to resize the iframe to fit the content of the app.
             */
            const app = document.getElementById('app');

            function expandContentHeight() {
                const newHeight = [100, 200, 300, 500][Math.floor(Math.random() * 4)];
                console.log('Click: expanding content height to ' + newHeight + 'px...');
                app.style.height = newHeight + 'px';
            }
            function expandAppHeight() {
                const height = document.body.offsetHeight;
                console.log('\texpanding app height to (document.body.offsetHeight): ' + height);
                window.parent.postMessage({ type: 'appEmbed:resize', height: height }, '*');
            }

            document.addEventListener('DOMContentLoaded', (event) => {
                console.log('DOMContentLoaded');
                expandAppHeight();

                // Observe body size changes and notify parent to resize iframe
                const resizeObserver = new ResizeObserver(() => {
                    expandAppHeight();
                });
                resizeObserver.observe(app);
            });
        </script>
    </body>
</html>
