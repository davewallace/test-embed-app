<html>
    <head>
        <title>Generic Web App</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            /**
             * All CSS Variables from the parent DOM (Totara) are available in a Shadow DOM's stylesheets, so we can use them to style the embedded app.
             * This allows the embedded app to automatically match the Totara theme without needing to duplicate any theme logic.
             */
            html, body {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                border: none;
            }
                #app {
                    padding: var(--gap-4);
                    color: var(--color-state);
                    background: var(--color-background);
                }
        </style>
    </head>

    <body>
        <div id="app">
            <p>Hello Totara.</p>
            <button onclick="expandContentHeight()">Expand content height</button>
        </div>
        <script type="text/javascript">

            /**
             * Totara and App need this
             */
            const app = document.getElementById('app');

            /**
             * App-only logic
             */
            function expandContentHeight() {
                const newHeight = [100, 200, 300, 500][Math.floor(Math.random() * 4)];
                console.log('[App]: Click: expanding content height to ' + newHeight + 'px...');
                app.style.height = newHeight + 'px';
            }

            /**
             * Totara-injected logic
             */
            function expandAppHeight(newHeight) {
                const height = newHeight || document.body.offsetHeight;
                console.log('\t[App]: expanding app height to: ' + height);
                window.parent.postMessage({ type: 'appEmbed:resize', height: height }, '*');
            }

            document.addEventListener('DOMContentLoaded', (event) => {

                console.log('[App]: DOMContentLoaded, first height expansion (' + document.body.offsetHeight + 'px).');
                expandAppHeight();

                // Observe body size changes and notify parent to resize iframe
                const resizeObserver = new ResizeObserver((e) => {

                    console.log('[App]: ResizeObserver...');
                    expandAppHeight(e[0].contentRect.height);
                });
                resizeObserver.observe(app);
            });

            // receive CSS variables from parent DOM (Totara) and apply to this document
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'appEmbed:cssVariables') {
                    const style = document.createElement('style');
                    style.textContent = event.data.css;
                    document.head.appendChild(style);
                }
            });

        </script>
    </body>
</html>
