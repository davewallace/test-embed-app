<html>
    <head>
        <title>Generic Web App</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            /**
             * All CSS Variables from the parent DOM (Totara) are available in a Shadow DOM's stylesheets, so we can use them to style the embedded app.
             * This allows the embedded app to automatically match the Totara theme without needing to duplicate any theme logic.
             */
            body {
                color: var(--color-primary);
                background: var(--color-background);
            }
        </style>
    </head>

    <body>
        <p>Hello Totara.</p>
        <button onclick="expandAppHeight()">Expand app height</button>
        <script type="text/javascript">
            /**
             * This is a generic web app that can be embedded in Totara using the AppEmbed component.
             * This app could be anything, with any height, including being fully dynamic, so we need
             * to send a message to the parent DOM (Totara) to tell it to resize the iframe to fit the content of the app.
             */
            function expandAppHeight() {
                window.parent.postMessage({ type: 'appEmbed:resize', height: document.body.scrollHeight }, '*');
            }
            function expandAppHeight() {
                document.getElementsByTagName('body')[0].style.height = Math.random() * 500 + 100 + 'px';
            }
        </script>
    </body>
</html>
