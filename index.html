<html>
    <head>
        <title>Embedded Web App Index</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            /**
             * All CSS Variables from the parent DOM (Totara) are available in a Shadow DOM's stylesheets, so we can use them to style the embedded app.
             * This allows the embedded app to automatically match the Totara theme without needing to duplicate any theme logic.
             */
            html, body {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                border: none;
            }
                #app {
                    overflow: auto;
                    color: var(--color-state);
                    background: var(--color-background);
                }
        </style>
        <script preload src="app-embed.js" type="text/javascript" language="javascript"></script>
    </head>
    <body>
        <div id="app">
            <p>Hello Totara.</p>
            <p>Choose one of the following types of app to display in this embedded component:</p>
            <ul>
                <li><a href="simpleexpander/">Simple Expander</a></li>
                <li><a href="kitchensink/">Dynamic content web app (Kineo's Adapt)</a></li>
            </ul>
        </div>
    </body>
</html>
