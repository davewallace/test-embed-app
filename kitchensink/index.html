    <head>
        <script type="text/javascript">
            window.ISCOOKIELMS = false;
        </script>
        <script src="offline_API_wrapper.js" type="text/javascript" language="javascript"></script>
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta content="utf-8" http-equiv="encoding">
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <title></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
        <link href="adapt/css/adapt.css" type="text/css" rel="stylesheet"/>
        <script preload src="../app-embed.js" type="text/javascript" language="javascript"></script>
        <script src="libraries/modernizr.js" type="text/javascript" language="javascript"></script>
        <script src="adapt/js/scriptLoader.js" type="text/javascript" language="javascript"></script>
        <style type="text/css">
            /**
             * All CSS Variables from the parent DOM (Totara) are available in a Shadow DOM's stylesheets, so we can use them to style the embedded app.
             * This allows the embedded app to automatically match the Totara theme without needing to duplicate any theme logic.
             */
            html, body {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                border: none;
            }
                #app {
                    color: var(--color-state);
                    overflow: auto;
                    background: var(--color-background);
                }
        </style>
    </head>

    <body>
        <button id="accessibility-toggle" class="base button a11y-ignore-focus" role="button" ></button>
        <span id="accessibility-instructions" class="aria-label" role="region" tabindex="0"></span>
        <div id="app">
            <p><a href="../">&lt; Go back</a></p>
            <div id="wrapper">
            </div>
        </div>
    </body>
</html>
