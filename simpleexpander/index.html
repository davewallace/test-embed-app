<html>
    <head>
        <title>Simple Web App</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style type="text/css">
            /**
             * All CSS Variables from the parent DOM (Totara) are available in a Shadow DOM's stylesheets, so we can use them to style the embedded app.
             * This allows the embedded app to automatically match the Totara theme without needing to duplicate any theme logic.
             */
            html, body {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                border: none;
            }
                #app {
                    min-height: 1px;
                    overflow: auto;
                    color: var(--color-state);
                    background: var(--color-background, #EFEFEF);

                    transition-property: min-height;
                    transition-duration: 3s;
                }
        </style>
        <script preload src="https://davewallace.github.io/test-embed-app/app-embed.js" type="text/javascript" language="javascript"></script>
    </head>

    <body>
        <div id="app">
            <p><a href="../">&lt; Go back</a></p>
            <p>Expanding the content height of this embedded component should adjust the height of the parent iframe, to avoid scrollbars.</p>
            <button onclick="expandContentHeight()">Expand content height</button>
        </div>
    </body>
    <script type="text/javascript">
        /**
         * App-only logic
         */
        let appHeight = 0;
        function expandContentHeight() {

            let newHeight = generateNewHeight();
            while (newHeight == appHeight) {
                newHeight = generateNewHeight();
            }
            console.log('[App]: Click: expanding content height to ' + newHeight + 'px...');
            app.style.minHeight = newHeight + 'px';
            appHeight = newHeight; // cache value
        }
        function generateNewHeight() {
            return [200, 300, 400, 500][Math.floor(Math.random() * 4)];
        }
    </script>
</html>
